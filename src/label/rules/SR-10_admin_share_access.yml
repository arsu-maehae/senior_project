# SR-10 — adapted from SigmaHQ rules/windows/builtin/security/win_security_admin_share_access.yml at commit 54967d64e6dda2b4daa81f47f7a8bf1f591b68a0; Detection Rule License (DRL) 1.1, https://github.com/SigmaHQ/Detection-Rule-License.
# Adapted (field-format fix, decision 056 P1): Windows logs ShareName as \\*\ADMIN$, so the selection
# ShareName: 'Admin$' (equals) became ShareName|endswith: '\ADMIN$'. New id; the original id is kept under
# related (type derived). Every other field is unchanged.
title: Access To ADMIN$ Network Share
id: 2495f327-9507-4c39-b2f9-d951d2521b69
related:
    - id: 098d7118-55bc-4912-a836-dc6483a8d150
      type: derived
status: test
description: Detects access to ADMIN$ network share
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5140
author: Florian Roth (Nextron Systems)
date: 2017-03-04
modified: 2024-01-16
tags:
    - attack.lateral-movement
    - attack.t1021.002
logsource:
    product: windows
    service: security
    definition: 'Requirements: The advanced audit policy setting "Object Access > Audit File Share" must be configured for Success/Failure'
detection:
    selection:
        EventID: 5140
        ShareName|endswith: '\ADMIN$'
    filter_main_computer_account:
        SubjectUserName|endswith: '$'
    condition: selection and not 1 of filter_*
falsepositives:
    - Legitimate administrative activity
level: low
