[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evtx-parsing-normalization"
version = "1.0.0"
description = "Loss-aware streaming EVTX/EVT to JSONL converter"
requires-python = ">=3.11"
dependencies = ["evtx>=0.13.1"]

[tool.setuptools]
packages = ["evtx_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

